name: Genesis read-only release verification

on:
  push:
    branches:
      - feature/genesis-readonly-site-status-20261101
      - fix/genesis-mobile-command-center-20261103
  pull_request:
    branches:
      - website/genesis-validation-refresh-20260923
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout reviewed branch without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show Node version
        run: node --version
      - name: Syntax-check public API handlers
        run: |
          node --check api/health.js
          node --check api/genesis/status.js
          node --check api/genesis/connection.js
      - name: Run offline read-only API and release safety tests
        run: |
          node --test tests/genesis-connection.test.js tests/genesis-public-api.test.js tests/genesis-site-ui.test.js
