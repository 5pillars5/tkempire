name: Smart Money History Schema Probe
on:
  pull_request:
    paths:
      - 'tests/smartmoney-history-live-schema-probe.js'
      - '.github/workflows/smartmoney-history-schema-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tests/smartmoney-history-live-schema-probe.js
