name: Genesis Auto monitor read-only contract tests
on:
  pull_request:
    paths:
      - 'api/genesis/auto-monitor.js'
      - 'api/genesis/auto-worker-feed.js'
      - 'assets/js/genesis-auto.js'
      - 'genesis-auto.html'
      - 'tests/genesis-auto-monitor.test.js'
      - 'tests/genesis-auto-worker-feed.test.js'
      - '.github/workflows/genesis-auto-monitor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check api/genesis/auto-monitor.js && node --check api/genesis/auto-worker-feed.js && node --check assets/js/genesis-auto.js
      - run: node --test tests/genesis-auto-monitor.test.js tests/genesis-auto-worker-feed.test.js
