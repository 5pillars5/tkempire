name: Routescan Archived Polygon Transfers Probe
on:
  pull_request:
    paths:
      - 'research/routescan-archival-index-probe-20261106.js'
      - '.github/workflows/routescan-archive-probe.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Research syntax
        run: node --check research/routescan-archival-index-probe-20261106.js
      - name: Probe indexed Polygon transfers
        run: node research/routescan-archival-index-probe-20261106.js
