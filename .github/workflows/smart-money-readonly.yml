name: Smart Money Read-Only Validation
on:
  push:
    branches:
      - feature/smart-money-watch-v1-20261106
  pull_request:
    paths:
      - 'api/smart-money-*.js'
      - 'smart-money*.html'
      - 'tests/smart-money-signals.test.js'
      - '.github/workflows/smart-money-readonly.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9e4c5323f # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check api/smart-money-core.js
          node --check api/smart-money-signals.js
          node --check api/smart-money-watch.js
      - name: Run deterministic signal and safety tests
        run: node --test tests/smart-money-signals.test.js
