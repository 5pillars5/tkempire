name: Sitewide live source consistency audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'results.html'
      - 'assets/js/genesis-live.js'
      - 'tests/sitewide-live-source-audit.cjs'
      - '.github/workflows/sitewide-consistency-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run local semantic regression tests
        run: node --test tests/sitewide-consistency.test.js
      - name: Audit the live public website and public API routes, GET only
        run: node tests/sitewide-live-source-audit.cjs
