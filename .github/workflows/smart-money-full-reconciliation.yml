name: Smart Money Full History Reconciliation (Read Only)
on:
  pull_request:
    paths:
      - 'research/smart-money-full-reconciliation-20261106.js'
      - '.github/workflows/smart-money-full-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify research syntax
        run: node --check research/smart-money-full-reconciliation-20261106.js
      - name: Read-only exhaustive closed and held position reconciliation
        run: node research/smart-money-full-reconciliation-20261106.js
