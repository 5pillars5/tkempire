name: Verify Original VPS Smart Money Import Live Readback
on:
  pull_request:
    paths:
      - 'tests/smart-money-original-vps-import-live-readback.js'
      - '.github/workflows/smart-money-original-vps-import-live-readback.yml'
  push:
    branches: [main]
    paths:
      - 'tests/smart-money-original-vps-import-live-readback.js'
      - '.github/workflows/smart-money-original-vps-import-live-readback.yml'
      - 'api/smart-money-legacy-history.js'
      - 'smart-money-flow.html'
      - 'assets/js/smart-money-flow-map.js'
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate readback assertion script
        run: node --check tests/smart-money-original-vps-import-live-readback.js
      - name: Check public Flow Map and original VPS history import status
        run: node tests/smart-money-original-vps-import-live-readback.js
