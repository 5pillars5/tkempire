name: Verify Imperian Pricing Policy (No Billing)
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/imperian-pricing-policy.js'
      - 'tests/imperian-pricing-policy.test.js'
      - 'docs/imperian-price-protection-v1.md'
      - '.github/workflows/imperian-pricing-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check lib/imperian-pricing-policy.js
          node --check tests/imperian-pricing-policy.test.js
      - name: Run safe isolated pricing tests
        run: node --test tests/imperian-pricing-policy.test.js
