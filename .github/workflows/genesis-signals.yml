name: Verify Read-Only Genesis Signals
on:
  pull_request:
    paths:
      - 'genesis-signals.html'
      - 'api/genesis/signals.js'
      - 'api/genesis/prices.js'
      - 'tests/genesis-market-prices.test.js'
      - 'assets/js/site-tabs.js'
      - 'sitemap.xml'
      - 'tests/genesis-public-signals.test.js'
      - 'tests/genesis-signals-ui.test.js'
      - 'tests/genesis-public-api.test.js'
      - 'ops/genesis-public-signals-v1/publisher.py'
      - 'ops/genesis-public-signals-v1/test_publisher.py'
      - 'ops/genesis-public-signals-v1/install_disabled.py'
      - 'ops/genesis-public-signals-v1/test_install_disabled.py'
      - 'ops/genesis-public-signals-v1/stage_nginx_gateway.py'
      - 'ops/genesis-public-signals-v1/test_stage_nginx_gateway.py'
      - 'ops/genesis-public-signals-v1/export_snapshot.py'
      - 'ops/genesis-public-signals-v1/test_export_snapshot.py'
      - 'ops/genesis-public-signals-v1/credential_reader.py'
      - 'ops/genesis-public-signals-v1/test_credential_reader.py'
      - 'ops/genesis-public-signals-v1/install_credential_handoff.py'
      - 'ops/genesis-public-signals-v1/test_install_credential_handoff.py'
      - 'ops/genesis-public-signals-v1/refresh_snapshot.py'
      - 'ops/genesis-public-signals-v1/test_refresh_snapshot.py'
      - 'ops/genesis-public-signals-v1/refresh_cycle.py'
      - 'ops/genesis-public-signals-v1/test_refresh_cycle.py'
      - 'ops/genesis-public-signals-v1/install_refresh_timer.py'
      - 'ops/genesis-public-signals-v1/test_install_refresh_timer.py'
      - 'ops/genesis-public-signals-v1/test_approved_credential_reader.py'
      - 'ops/genesis-public-signals-v1/refresh_cycle_release.py'
      - 'ops/genesis-public-signals-v1/release_website_feed.py'
      - 'ops/genesis-public-signals-v1/test_release_website_feed.py'
      - '.github/workflows/genesis-signals.yml'
  push:
    branches: [main]
    paths:
      - 'genesis-signals.html'
      - 'api/genesis/signals.js'
      - 'api/genesis/prices.js'
      - 'tests/genesis-market-prices.test.js'
      - 'assets/js/site-tabs.js'
      - 'sitemap.xml'
      - 'tests/genesis-public-signals.test.js'
      - 'tests/genesis-signals-ui.test.js'
      - 'tests/genesis-public-api.test.js'
      - 'ops/genesis-public-signals-v1/publisher.py'
      - 'ops/genesis-public-signals-v1/test_publisher.py'
      - 'ops/genesis-public-signals-v1/install_disabled.py'
      - 'ops/genesis-public-signals-v1/test_install_disabled.py'
      - 'ops/genesis-public-signals-v1/stage_nginx_gateway.py'
      - 'ops/genesis-public-signals-v1/test_stage_nginx_gateway.py'
      - 'ops/genesis-public-signals-v1/export_snapshot.py'
      - 'ops/genesis-public-signals-v1/test_export_snapshot.py'
      - 'ops/genesis-public-signals-v1/credential_reader.py'
      - 'ops/genesis-public-signals-v1/test_credential_reader.py'
      - 'ops/genesis-public-signals-v1/install_credential_handoff.py'
      - 'ops/genesis-public-signals-v1/test_install_credential_handoff.py'
      - 'ops/genesis-public-signals-v1/refresh_snapshot.py'
      - 'ops/genesis-public-signals-v1/test_refresh_snapshot.py'
      - 'ops/genesis-public-signals-v1/refresh_cycle.py'
      - 'ops/genesis-public-signals-v1/test_refresh_cycle.py'
      - 'ops/genesis-public-signals-v1/install_refresh_timer.py'
      - 'ops/genesis-public-signals-v1/test_install_refresh_timer.py'
      - 'ops/genesis-public-signals-v1/test_approved_credential_reader.py'
      - 'ops/genesis-public-signals-v1/refresh_cycle_release.py'
      - 'ops/genesis-public-signals-v1/release_website_feed.py'
      - 'ops/genesis-public-signals-v1/test_release_website_feed.py'
      - '.github/workflows/genesis-signals.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check api/genesis/signals.js
          node --check api/genesis/prices.js
          node --check tests/genesis-market-prices.test.js
          node --check tests/genesis-public-signals.test.js
          node --check tests/genesis-signals-ui.test.js
      - name: Verify read-only API, safety and UI
        run: node --test tests/genesis-public-signals.test.js tests/genesis-public-api.test.js tests/genesis-signals-ui.test.js tests/genesis-market-prices.test.js
      - name: Validate VPS publisher syntax
        run: python3 -m py_compile ops/genesis-public-signals-v1/publisher.py ops/genesis-public-signals-v1/test_publisher.py ops/genesis-public-signals-v1/install_disabled.py ops/genesis-public-signals-v1/test_install_disabled.py ops/genesis-public-signals-v1/stage_nginx_gateway.py ops/genesis-public-signals-v1/test_stage_nginx_gateway.py ops/genesis-public-signals-v1/export_snapshot.py ops/genesis-public-signals-v1/test_export_snapshot.py ops/genesis-public-signals-v1/credential_reader.py ops/genesis-public-signals-v1/test_credential_reader.py ops/genesis-public-signals-v1/install_credential_handoff.py ops/genesis-public-signals-v1/test_install_credential_handoff.py ops/genesis-public-signals-v1/refresh_snapshot.py ops/genesis-public-signals-v1/test_refresh_snapshot.py ops/genesis-public-signals-v1/refresh_cycle.py ops/genesis-public-signals-v1/test_refresh_cycle.py ops/genesis-public-signals-v1/install_refresh_timer.py ops/genesis-public-signals-v1/test_install_refresh_timer.py ops/genesis-public-signals-v1/test_approved_credential_reader.py ops/genesis-public-signals-v1/refresh_cycle_release.py ops/genesis-public-signals-v1/release_website_feed.py ops/genesis-public-signals-v1/test_release_website_feed.py
      - name: Test read-only publisher with offline fixtures
        run: python3 -m unittest discover -s ops/genesis-public-signals-v1 -p 'test_*.py' -v
