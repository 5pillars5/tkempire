name: Smart Money Targeted Fill Lot Reconciliation
on:
  pull_request:
    paths:
      - 'research/smart-money-lot-reconciliation-20261106.js'
      - 'tests/smart-money-lot-reconciliation.test.js'
      - '.github/workflows/smart-money-lot-reconciliation.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify model syntax and invariants
        run: |
          node --check research/smart-money-lot-reconciliation-20261106.js
          node tests/smart-money-lot-reconciliation.test.js
      - name: Fetch public fill lot and resolution evidence
        run: node research/smart-money-lot-reconciliation-20261106.js
