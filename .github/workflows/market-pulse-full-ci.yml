name: Genesis Market Pulse full offline CI
on:
  push:
    branches: [feature/genesis-market-pulse-readonly-20261112]
    paths:
      - 'genesis-market-pulse.html'
      - 'assets/js/genesis-market-pulse-core.js'
      - 'assets/js/site-tabs.js'
      - 'tests/genesis-market-pulse.test.js'
      - '.github/workflows/market-pulse-full-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'genesis-market-pulse.html'
      - 'assets/js/genesis-market-pulse-core.js'
      - 'assets/js/site-tabs.js'
      - 'tests/genesis-market-pulse.test.js'
      - '.github/workflows/market-pulse-full-ci.yml'
permissions:
  contents: read
jobs:
  node-offline:
    name: Complete offline Node regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate Market Pulse and navigation syntax
        run: |
          node --check assets/js/genesis-market-pulse-core.js
          node --check assets/js/site-tabs.js
      - name: Run all offline Node test files
        run: node --test tests/*.test.js
  python-publisher:
    name: Read-only publisher Python regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run publisher regression suite
        run: python3 -m unittest discover -s ops/genesis-public-signals-v1 -p 'test_*.py' -v
