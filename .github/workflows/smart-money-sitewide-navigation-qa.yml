name: Smart Money Sitewide Navigation QA
on:
  pull_request:
    paths:
      - 'assets/js/site-tabs.js'
      - 'assets/css/site-tabs.css'
      - '*.html'
      - 'sitemap.xml'
      - 'tests/sitewide-smartmoney-navigation.cjs'
      - '.github/workflows/smart-money-sitewide-navigation-qa.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/site-tabs.js'
      - 'assets/css/site-tabs.css'
      - '*.html'
      - 'sitemap.xml'
      - 'tests/sitewide-smartmoney-navigation.cjs'
      - '.github/workflows/smart-money-sitewide-navigation-qa.yml'
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check canonical navigation script and test syntax
        run: |
          node --check assets/js/site-tabs.js
          node --check tests/sitewide-smartmoney-navigation.cjs
      - name: Install pinned browser automation library
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Verify desktop, mobile, keyboard, page entry links and dashboard status
        run: node tests/sitewide-smartmoney-navigation.cjs
