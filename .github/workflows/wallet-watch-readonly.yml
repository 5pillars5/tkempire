name: Wallet Watch read-only preview verification
on:
  pull_request:
    paths:
      - 'wallet-watch.html'
      - 'api/wallet-watch.js'
      - 'assets/js/site-tabs.js'
      - 'assets/js/empire-unified.js'
      - 'tests/wallet-watch.test.js'
      - '.github/workflows/wallet-watch-readonly.yml'
permissions:
  contents: read
jobs:
  wallet-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check API, browser JS and tests
        run: |
          node --check api/wallet-watch.js
          node --check assets/js/site-tabs.js
          node --check assets/js/empire-unified.js
          node --check tests/wallet-watch.test.js
      - name: Verify source normalization, safety and navigation
        run: node --test tests/wallet-watch.test.js tests/empire-ux-navigation.test.js
