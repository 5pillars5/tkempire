name: Genesis signals refresh pin security tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/genesis-public-signals-v1/repair_nginx_refresh_pin.py'
      - 'ops/genesis-public-signals-v1/test_repair_nginx_refresh_pin.py'
      - '.github/workflows/genesis-signals-nginx-pin-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Compile exact-diff repair
        run: python -m py_compile ops/genesis-public-signals-v1/repair_nginx_refresh_pin.py
      - name: Run adversarial Nginx diff tests
        run: python ops/genesis-public-signals-v1/test_repair_nginx_refresh_pin.py -v
      - name: Preserve existing read-only publisher tests
        run: python ops/genesis-public-signals-v1/test_refresh_cycle.py -v
