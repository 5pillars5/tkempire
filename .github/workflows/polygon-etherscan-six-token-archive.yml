name: Read-only Polygon ERC1155 Six-Token Archive
on:
  pull_request:
    paths:
      - 'research/etherscan-v2-six-token-archival-20261106.js'
      - 'tests/etherscan-v2-six-token-archival.test.js'
      - '.github/workflows/polygon-etherscan-six-token-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      EVIDENCE_DIR: ${{ runner.temp }}/smartmoney-six-token-index
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test schema invariants and parser
        run: |
          node --check research/etherscan-v2-six-token-archival-20261106.js
          node tests/etherscan-v2-six-token-archival.test.js
      - name: Check archival access configuration without revealing secret
        id: auth
        shell: bash
        run: |
          if [ -n "${ETHERSCAN_API_KEY:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ARCHIVAL_AUTH=CONFIGURED"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ARCHIVAL_AUTH=NOT_CONFIGURED"
            echo "INDEX_RETRIEVAL=BLOCKED_MISSING_SECRET"
          fi
      - name: Fetch and reconcile historical ERC1155 transfers
        if: steps.auth.outputs.ready == 'true'
        run: node research/etherscan-v2-six-token-archival-20261106.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.auth.outputs.ready == 'true' && success()
        with:
          name: polygon-six-token-public-transfer-evidence
          path: ${{ runner.temp }}/smartmoney-six-token-index/
          retention-days: 3
          if-no-files-found: error
